<script>
(()=>{
  let waiting,currentButton;
  const field=(block,label,next)=>{const end=next?`(?=${next}\\s*:)`:'$';return (block.match(new RegExp(`${label}\\s*:\\s*([\\s\\S]*?)${end}`,'i'))?.[1]||'').trim();};
  const importText=text=>{
    const blocks=String(text||'').split(/(?=Núm inst:\s*)/i).filter(x=>/Núm inst:\s*/i.test(x));
    if(!blocks.length)throw new Error('No se encontraron referidos para importar.');
    const rows=blocks.map(block=>[
      field(block,'Núm inst','Nombre Cliente'),field(block,'Nombre Cliente','Canal'),field(block,'Canal','Nombre'),
      field(block,'Nombre','Teléfono'),field(block,'Teléfono','Tipo'),field(block,'Tipo','Otro tipo|Observaciones|Creado'),
      field(block,'Otro tipo','Observaciones|Creado'),field(block,'Observaciones','Creado|Estado'),field(block,'Creado','Estado'),
      field(block,'Estado','Sub Estado'),field(block,'Sub Estado','Última LLamada|Última Llamada'),
      field(block,'Última LLamada|Última Llamada','Seguimiento'),field(block,'Seguimiento','$')
    ]);
    config.Referidos.rows=rows;
    const data=JSON.parse(localStorage.getItem(recordsKey())||'{}');data.Referidos=rows;localStorage.setItem(recordsKey(),JSON.stringify(data));
    select('Referidos');
    return rows.length;
  };
  document.addEventListener('click',event=>{
    const button=event.target.closest('button');
    if(!button||button.textContent.trim()!=='Sincronizar referidos')return;
    event.preventDefault();event.stopImmediatePropagation();currentButton=button;
    clearTimeout(waiting);button.disabled=true;button.textContent='Sincronizando…';
    window.dispatchEvent(new Event('referidos-request-sync'));
    waiting=setTimeout(()=>{button.disabled=false;button.textContent='Sincronizar referidos';alert('No se recibió información. Abre Comparte Protección, pulsa allí “Sincronizar referidos” y vuelve a intentarlo.');},2500);
  },true);
  window.addEventListener('referidos-sync',event=>{
    clearTimeout(waiting);
    const button=currentButton||[...document.querySelectorAll('button')].find(x=>x.textContent.trim().includes('referidos'));
    try{const count=importText(event.detail);button.textContent=`${count} referidos sincronizados`;setTimeout(()=>button.textContent='Sincronizar referidos',1800);}
    catch(error){console.error(error);button.textContent='Sincronizar referidos';alert(error.message);}
    finally{button.disabled=false;}
  });
})();
</script>
